name: Build Corne Official Vial Firmware with Always-On US-to-JIS Mode

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Clone Official foostan Repository with Submodules
        run: |
          git config --global --add safe.directory '*'
          git clone --recursive https://github.com/foostan/kbd_firmware.git

      - name: Setup and Link Folders for Build
        run: |
          cd kbd_firmware/src/vial-kb/vial-qmk
          mkdir -p keyboards/
          cp -r ../../../keyboards/crkbd keyboards/
          mkdir -p keyboards/crkbd/rev4_0/standard/keymaps
          cp -r keyboards/crkbd/vial-kb/vial-qmk/keymaps/vial keyboards/crkbd/rev4_0/standard/keymaps/vial

      - name: Append Optimized Always-On US-Emulation Code to ALL keymap.c files
        run: |
          cat << 'EOF' > perfect_patch.c

          // ========================================================
          // Optimized Always-On US Keyboard Emulation for JIS Windows
          // ========================================================
          void send_jis_key(uint16_t keycode, bool target_shift, bool current_shift) {
              if (current_shift != target_shift) {
                  if (current_shift) { unregister_code(KC_LSFT); } else { register_code(KC_LSFT); }
              }
              tap_code(keycode); // QMK標準の軽量タップ処理を使用
              if (current_shift != target_shift) {
                  if (current_shift) { register_code(KC_LSFT); } else { unregister_code(KC_LSFT); }
              }
          }

          bool process_record_user(uint16_t keycode, keyrecord_t *record) {
              // 変換対象のキーのみをキャッチし、それ以外（アルファベット等）は計算せずに即スルーする
              switch (keycode) {
                  case KC_2: case KC_6: case KC_7: case KC_8: case KC_9: case KC_0:
                  case KC_MINS: case KC_EQL: case KC_LBRC: case KC_RBRC:
                  case KC_SCLN: case KC_QUOT: case KC_BSLS:
                      // キーが押し込まれた瞬間のみ変換処理を実行
                      if (record->event.pressed) {
                          bool current_shift = (get_mods() & MOD_MASK_SHIFT) || (get_weak_mods() & MOD_MASK_SHIFT);
                          switch (keycode) {
                              case KC_2:    if (current_shift) { send_jis_key(KC_LBRC, false, current_shift); } else { send_jis_key(KC_2, false, current_shift); } break;
                              case KC_6:    if (current_shift) { send_jis_key(KC_EQL, true, current_shift); }  else { send_jis_key(KC_6, false, current_shift); } break;
                              case KC_7:    if (current_shift) { send_jis_key(KC_6, true, current_shift); }   else { send_jis_key(KC_7, false, current_shift); } break;
                              case KC_8:    if (current_shift) { send_jis_key(KC_QUOT, false, current_shift); }else { send_jis_key(KC_8, false, current_shift); } break;
                              case KC_9:    if (current_shift) { send_jis_key(KC_8, true, current_shift); }   else { send_jis_key(KC_9, false, current_shift); } break;
                              case KC_0:    if (current_shift) { send_jis_key(KC_9, true, current_shift); }   else { send_jis_key(KC_0, false, current_shift); } break;
                              case KC_MINS: if (current_shift) { send_jis_key(KC_EQL, false, current_shift); } else { send_jis_key(KC_MINS, false, current_shift); } break;
                              case KC_EQL:  if (current_shift) { send_jis_key(KC_EQL, true, current_shift); }  else { send_jis_key(KC_MINS, true, current_shift); } break;
                              case KC_LBRC: if (current_shift) { send_jis_key(KC_RBRC, true, current_shift); } else { send_jis_key(KC_RBRC, false, current_shift); } break;
                              case KC_RBRC: if (current_shift) { send_jis_key(KC_NUHS, true, current_shift); } else { send_jis_key(KC_NUHS, false, current_shift); } break;
                              case KC_SCLN: if (current_shift) { send_jis_key(KC_QUOT, true, current_shift); } else { send_jis_key(KC_SCLN, false, current_shift); } break;
                              case KC_QUOT: if (current_shift) { send_jis_key(KC_2, true, current_shift); }    else { send_jis_key(KC_7, true, current_shift); } break;
                              case KC_BSLS: if (current_shift) { send_jis_key(KC_INT3, true, current_shift); } else { send_jis_key(KC_BSLS, false, current_shift); } break;
                          }
                      }
                      // 変換対象のキーは、押した時も離した時も元の信号をOSへ流さない（無駄な通信の遮断）
                      return false;
              }
              return true;
          }
          EOF

          # 全ての候補ファイルに一括追記して適用漏れを防ぐ
          find kbd_firmware/src/vial-kb/vial-qmk/keyboards/crkbd -name "keymap.c" -exec sh -c 'cat perfect_patch.c >> "$1"' _ {} \;

      # キャッシュを使用してビルドを高速化
      - name: Cache QMK Build Artifacts
        uses: actions/cache@v4
        with:
          path: kbd_firmware/src/vial-kb/vial-qmk/.build
          key: qmk-build-crkbd-${{ github.run_id }}
          restore-keys: |
            qmk-build-crkbd-

      - name: Build Official Firmware
        run: |
          cd kbd_firmware/src/vial-kb/vial-qmk
          qmk compile -kb crkbd/rev4_0/standard -km vial

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: corne_official_vial_firmware
          path: kbd_firmware/src/vial-kb/vial-qmk/*.uf2
