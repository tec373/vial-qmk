name: Build Corne Official Vial Firmware with Always-On US-to-JIS Mode

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Clone Official foostan Repository with Submodules
        run: |
          git config --global --add safe.directory '*'
          git clone --recursive https://github.com/foostan/kbd_firmware.git

      - name: Setup and Link Folders for Build
        run: |
          cd kbd_firmware/src/vial-kb/vial-qmk
          mkdir -p keyboards/
          cp -r ../../../keyboards/crkbd keyboards/
          mkdir -p keyboards/crkbd/rev4_0/standard/keymaps
          cp -r keyboards/crkbd/vial-kb/vial-qmk/keymaps/vial keyboards/crkbd/rev4_0/standard/keymaps/vial

      - name: Append Optimized Always-On US-Emulation Code to ALL keymap.c files
        run: |
          cat << 'EOF' > perfect_patch.c

          // ========================================================
          // Optimized Always-On US Keyboard Emulation for JIS Windows
          // ========================================================
          void send_jis_key(uint16_t keycode, bool target_shift, bool os_shift) {
              // OSが認識しているShift状態と、出したい記号のShift状態を合わせる
              if (os_shift != target_shift) {
                  if (os_shift) { unregister_code(KC_LSFT); } else { register_code(KC_LSFT); }
              }
              tap_code(keycode);
              // 元のShift状態に戻す
              if (os_shift != target_shift) {
                  if (os_shift) { register_code(KC_LSFT); } else { unregister_code(KC_LSFT); }
              }
          }

          bool process_record_user(uint16_t keycode, keyrecord_t *record) {
              if (!record->event.pressed) { return true; }

              uint16_t base_kc = keycode;
              bool kc_shift = false;

              // VialのS+Key機能（LSFTやRSFTマクロ）が飛んできた場合、ベースキーとShift要素に分解する
              if ((keycode & 0xFF00) == LSFT(0) || (keycode & 0xFF00) == RSFT(0)) {
                  base_kc = keycode & 0xFF;
                  kc_shift = true;
              }

              switch (base_kc) {
                  case KC_2: case KC_6: case KC_7: case KC_8: case KC_9: case KC_0:
                  case KC_MINS: case KC_EQL: case KC_LBRC: case KC_RBRC:
                  case KC_SCLN: case KC_QUOT: case KC_BSLS:
                  {
                      // 物理的に押されているShiftと、Vialの機能によるShiftを総合的に判断する
                      bool physical_shift = (get_mods() & MOD_MASK_SHIFT) || (get_weak_mods() & MOD_MASK_SHIFT);
                      bool logical_shift = physical_shift || kc_shift;

                      switch (base_kc) {
                          case KC_2:    if (logical_shift) { send_jis_key(KC_LBRC, false, physical_shift); } else { send_jis_key(KC_2, false, physical_shift); } break;
                          case KC_6:    if (logical_shift) { send_jis_key(KC_EQL, false, physical_shift); }  else { send_jis_key(KC_6, false, physical_shift); } break;
                          case KC_7:    if (logical_shift) { send_jis_key(KC_6, true, physical_shift); }     else { send_jis_key(KC_7, false, physical_shift); } break;
                          case KC_8:    if (logical_shift) { send_jis_key(KC_QUOT, true, physical_shift); }  else { send_jis_key(KC_8, false, physical_shift); } break;
                          case KC_9:    if (logical_shift) { send_jis_key(KC_8, true, physical_shift); }     else { send_jis_key(KC_9, false, physical_shift); } break;
                          case KC_0:    if (logical_shift) { send_jis_key(KC_9, true, physical_shift); }     else { send_jis_key(KC_0, false, physical_shift); } break;
                          case KC_MINS: if (logical_shift) { send_jis_key(KC_INT1, true, physical_shift); }  else { send_jis_key(KC_MINS, false, physical_shift); } break;
                          case KC_EQL:  if (logical_shift) { send_jis_key(KC_SCLN, true, physical_shift); }  else { send_jis_key(KC_MINS, true, physical_shift); } break;
                          case KC_LBRC: if (logical_shift) { send_jis_key(KC_RBRC, true, physical_shift); }  else { send_jis_key(KC_RBRC, false, physical_shift); } break;
                          case KC_RBRC: if (logical_shift) { send_jis_key(KC_NUHS, true, physical_shift); }  else { send_jis_key(KC_NUHS, false, physical_shift); } break;
                          case KC_SCLN: if (logical_shift) { send_jis_key(KC_QUOT, false, physical_shift); } else { send_jis_key(KC_SCLN, false, physical_shift); } break;
                          case KC_QUOT: if (logical_shift) { send_jis_key(KC_2, true, physical_shift); }     else { send_jis_key(KC_7, true, physical_shift); } break;
                          case KC_BSLS: if (logical_shift) { send_jis_key(KC_INT3, true, physical_shift); }  else { send_jis_key(KC_BSLS, false, physical_shift); } break;
                      }
                      return false; // 翻訳したキーだけを送るため、QMK本来の送信はブロックする
                  }
              }
              return true;
          }
          EOF

          # 全ての候補ファイルに一括追記
          find kbd_firmware/src/vial-kb/vial-qmk/keyboards/crkbd -name "keymap.c" -exec sh -c 'cat perfect_patch.c >> "$1"' _ {} \;

      # キャッシュを使用してビルドを高速化
      - name: Cache QMK Build Artifacts
        uses: actions/cache@v4
        with:
          path: kbd_firmware/src/vial-kb/vial-qmk/.build
          key: qmk-build-crkbd-${{ github.run_id }}
          restore-keys: |
            qmk-build-crkbd-

      - name: Build Official Firmware
        run: |
          cd kbd_firmware/src/vial-kb/vial-qmk
          qmk compile -kb crkbd/rev4_0/standard -km vial

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: corne_official_vial_firmware
          path: kbd_firmware/src/vial-kb/vial-qmk/*.uf2
