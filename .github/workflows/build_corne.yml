name: Build Corne Official Vial Firmware with Perfect US-to-JIS Mode

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Clone Official foostan Repository with Submodules
        run: |
          git config --global --add safe.directory '*'
          git clone --recursive https://github.com/foostan/kbd_firmware.git

      - name: Setup and Link Folders for Build
        run: |
          cd kbd_firmware/src/vial-kb/vial-qmk
          mkdir -p keyboards/
          cp -r ../../../keyboards/crkbd keyboards/
          mkdir -p keyboards/crkbd/rev4_0/standard/keymaps
          cp -r keyboards/crkbd/vial-kb/vial-qmk/keymaps/vial keyboards/crkbd/rev4_0/standard/keymaps/vial

          # 0x5F00をVialに正式に許可する設定をconfig.hへ追記
          echo "#define VIAL_CUSTOM_KEYCODE_COUNT 1" >> keyboards/crkbd/rev4_0/standard/config.h

      - name: Append Perfect US-Emulation Code to keymap.c
        run: |
          TARGET_FILE="kbd_firmware/src/vial-kb/vial-qmk/keyboards/crkbd/rev4_0/standard/keymaps/vial/keymap.c"
          
          cat << 'EOF' >> "$TARGET_FILE"

          // ========================================================
          // Perfect US Keyboard Emulation for JIS Windows (Appended)
          // ========================================================
          bool is_us_mode = false;

          // シフト状態を一時的に解除または付与して、安全にキーを叩く補助関数
          void send_jis_key(uint16_t keycode, bool target_shift, bool current_shift) {
              if (current_shift != target_shift) {
                  if (current_shift) { unregister_code(KC_LSFT); } else { register_code(KC_LSFT); }
              }
              register_code(keycode);
              unregister_code(keycode);
              if (current_shift != target_shift) {
                  if (current_shift) { register_code(KC_LSFT); } else { unregister_code(KC_LSFT); }
              }
          }

          bool process_record_user(uint16_t keycode, keyrecord_t *record) {
              // トグルキー（0x5F00）の処理
              if (keycode == 0x5F00) {
                  if (record->event.pressed) {
                      is_us_mode = !is_us_mode;
                  }
                  return false;
              }

              // モードOFF、またはキーを離した時はQMK標準の動きに任せる
              if (!is_us_mode || !record->event.pressed) {
                  return true;
              }

              // 現在、物理的またはVialの機能（S+Key等）でShiftが押されているか検知
              bool current_shift = (get_mods() & MOD_MASK_SHIFT) || (get_weak_mods() & MOD_MASK_SHIFT);

              // 変換ロジック（US配列の設定値を、JIS設定のWindowsが正しく解釈できる信号へ完全翻訳）
              switch (keycode) {
                  case KC_2:
                      if (current_shift) { send_jis_key(KC_LBRC, false, current_shift); } // Shift+2 -> At-mark
                      else { send_jis_key(KC_2, false, current_shift); } // 2 -> 2
                      return false;
                  case KC_6:
                      if (current_shift) { send_jis_key(KC_EQL, true, current_shift); } // Shift+6 -> Caret
                      else { send_jis_key(KC_6, false, current_shift); } // 6 -> 6
                      return false;
                  case KC_7:
                      if (current_shift) { send_jis_key(KC_6, true, current_shift); } // Shift+7 -> Ampersand
                      else { send_jis_key(KC_7, false, current_shift); } // 7 -> 7
                      return false;
                  case KC_8:
                      if (current_shift) { send_jis_key(KC_QUOT, false, current_shift); } // Shift+8 -> Asterisk
                      else { send_jis_key(KC_8, false, current_shift); } // 8 -> 8
                      return false;
                  case KC_9:
                      if (current_shift) { send_jis_key(KC_8, true, current_shift); } // Shift+9 -> Open-paren
                      else { send_jis_key(KC_9, false, current_shift); } // 9 -> 9
                      return false;
                  case KC_0:
                      if (current_shift) { send_jis_key(KC_9, true, current_shift); } // Shift+0 -> Close-paren
                      else { send_jis_key(KC_0, false, current_shift); } // 0 -> 0
                      return false;
                  case KC_MINS:
                      if (current_shift) { send_jis_key(KC_EQL, false, current_shift); } // Shift+- -> Under-score
                      else { send_jis_key(KC_MINS, false, current_shift); } // - -> -
                      return false;
                  case KC_EQL:
                      if (current_shift) { send_jis_key(KC_EQL, true, current_shift); } // Shift+= -> Plus
                      else { send_jis_key(KC_MINS, true, current_shift); } // = -> Equal
                      return false;
                  case KC_LBRC:
                      if (current_shift) { send_jis_key(KC_RBRC, true, current_shift); } // Shift+[ -> Open-brace
                      else { send_jis_key(KC_RBRC, false, current_shift); } // [ -> Bracket-L
                      return false;
                  case KC_RBRC:
                      if (current_shift) { send_jis_key(KC_NUHS, true, current_shift); } // Shift+] -> Close-brace
                      else { send_jis_key(KC_NUHS, false, current_shift); } // ] -> Bracket-R
                  case KC_SCLN:
                      if (current_shift) { send_jis_key(KC_QUOT, true, current_shift); } // Shift+; -> Colon
                      else { send_jis_key(KC_SCLN, false, current_shift); } // ; -> Semicolon
                      return false;
                  case KC_QUOT:
                      if (current_shift) { send_jis_key(KC_2, true, current_shift); } // Shift+' -> Quote
                      else { send_jis_key(KC_7, true, current_shift); } // ' -> Single-Quote
                      return false;
                  case KC_BSLS:
                      if (current_shift) { send_jis_key(KC_INT3, true, current_shift); } // Shift+Backslash -> Pipe
                      else { send_jis_key(KC_BSLS, false, current_shift); } // Backslash -> Backslash
                      return false;
              }
              return true;
          }
          EOF

      - name: Inject Custom Keycode Name into vial.json
        run: |
          JSON_FILE="kbd_firmware/keyboards/crkbd/the-via/crkbd_rev4.json"
          sed -i 's/}$/,"customKeycodes": [{"key": "0x5F00", "title": "JIS TRNS", "shortName": "JIS TRNS", "action": "Toggle JIS\/US Translation Mode"}]}/' "$JSON_FILE"

      # キャッシュを使用してビルドを高速化
      - name: Cache QMK Build Artifacts
        uses: actions/cache@v4
        with:
          path: kbd_firmware/src/vial-kb/vial-qmk/.build
          key: qmk-build-crkbd-${{ github.run_id }}
          restore-keys: |
            qmk-build-crkbd-

      - name: Build Official Firmware
        run: |
          cd kbd_firmware/src/vial-kb/vial-qmk
          qmk compile -kb crkbd/rev4_0/standard -km vial

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: corne_official_vial_firmware
          path: kbd_firmware/src/vial-kb/vial-qmk/*.uf2
