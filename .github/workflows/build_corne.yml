name: Build Corne Official Vial Firmware with Perfect US-to-JIS Mode

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Clone Official foostan Repository with Submodules
        run: |
          git config --global --add safe.directory '*'
          git clone --recursive https://github.com/foostan/kbd_firmware.git

      - name: Setup and Link Folders for Build
        run: |
          cd kbd_firmware/src/vial-kb/vial-qmk
          mkdir -p keyboards/
          cp -r ../../../keyboards/crkbd keyboards/
          mkdir -p keyboards/crkbd/rev4_0/standard/keymaps
          cp -r keyboards/crkbd/vial-kb/vial-qmk/keymaps/vial keyboards/crkbd/rev4_0/standard/keymaps/vial

      - name: Append Perfect US-Emulation Code (AG_TOGG Override) to ALL keymap.c files
        run: |
          # 一時的にパッチ用のC言語コードを作成
          cat << 'EOF' > perfect_patch.c

          // ========================================================
          // Perfect US Keyboard Emulation for JIS Windows (Appended)
          // ========================================================
          bool is_us_mode = false;

          void send_jis_key(uint16_t keycode, bool target_shift, bool current_shift) {
              if (current_shift != target_shift) {
                  if (current_shift) { unregister_code(KC_LSFT); } else { register_code(KC_LSFT); }
              }
              register_code(keycode);
              unregister_code(keycode);
              if (current_shift != target_shift) {
                  if (current_shift) { register_code(KC_LSFT); } else { unregister_code(KC_LSFT); }
              }
          }

          bool process_record_user(uint16_t keycode, keyrecord_t *record) {
              // QMK標準の「AG_TOGG」キーコードを検知して、USモードのトグルに流用する
              if (keycode == AG_TOGG) {
                  if (record->event.pressed) {
                      is_us_mode = !is_us_mode;
                  }
                  return false; // 本来のAlt/GUI入れ替え処理は実行させずにブロックする
              }

              // モードOFF、またはキーを離した時は通常の動きに任せる
              if (!is_us_mode || !record->event.pressed) {
                  return true;
              }

              bool current_shift = (get_mods() & MOD_MASK_SHIFT) || (get_weak_mods() & MOD_MASK_SHIFT);
              switch (keycode) {
                  case KC_2:
                      if (current_shift) { send_jis_key(KC_LBRC, false, current_shift); }
                      else { send_jis_key(KC_2, false, current_shift); }
                      return false;
                  case KC_6:
                      if (current_shift) { send_jis_key(KC_EQL, true, current_shift); }
                      else { send_jis_key(KC_6, false, current_shift); }
                      return false;
                  case KC_7:
                      if (current_shift) { send_jis_key(KC_6, true, current_shift); }
                      else { send_jis_key(KC_7, false, current_shift); }
                      return false;
                  case KC_8:
                      if (current_shift) { send_jis_key(KC_QUOT, false, current_shift); }
                      else { send_jis_key(KC_8, false, current_shift); }
                      return false;
                  case KC_9:
                      if (current_shift) { send_jis_key(KC_8, true, current_shift); }
                      else { send_jis_key(KC_9, false, current_shift); }
                      return false;
                  case KC_0:
                      if (current_shift) { send_jis_key(KC_9, true, current_shift); }
                      else { send_jis_key(KC_0, false, current_shift); }
                      return false;
                  case KC_MINS:
                      if (current_shift) { send_jis_key(KC_EQL, false, current_shift); }
                      else { send_jis_key(KC_MINS, false, current_shift); }
                      return false;
                  case KC_EQL:
                      if (current_shift) { send_jis_key(KC_EQL, true, current_shift); }
                      else { send_jis_key(KC_MINS, true, current_shift); }
                      return false;
                  case KC_LBRC:
                      if (current_shift) { send_jis_key(KC_RBRC, true, current_shift); }
                      else { send_jis_key(KC_RBRC, false, current_shift); }
                      return false;
                  case KC_RBRC:
                      if (current_shift) { send_jis_key(KC_NUHS, true, current_shift); }
                      else { send_jis_key(KC_NUHS, false, current_shift); }
                      return false;
                  case KC_SCLN:
                      if (current_shift) { send_jis_key(KC_QUOT, true, current_shift); }
                      else { send_jis_key(KC_SCLN, false, current_shift); }
                      return false;
                  case KC_QUOT:
                      if (current_shift) { send_jis_key(KC_2, true, current_shift); }
                      else { send_jis_key(KC_7, true, current_shift); }
                      return false;
                  case KC_BSLS:
                      if (current_shift) { send_jis_key(KC_INT3, true, current_shift); }
                      else { send_jis_key(KC_BSLS, false, current_shift); }
                      return false;
              }
              return true;
          }
          EOF

          # 全ての候補ファイルに一括追記してコンパイル漏れを防ぐ
          find kbd_firmware/src/vial-kb/vial-qmk/keyboards/crkbd -name "keymap.c" -exec sh -c 'cat perfect_patch.c >> "$1"' _ {} \;

      # キャッシュを使用してビルドを高速化
      - name: Cache QMK Build Artifacts
        uses: actions/cache@v4
        with:
          path: kbd_firmware/src/vial-kb/vial-qmk/.build
          key: qmk-build-crkbd-${{ github.run_id }}
          restore-keys: |
            qmk-build-crkbd-

      - name: Build Official Firmware
        run: |
          cd kbd_firmware/src/vial-kb/vial-qmk
          qmk compile -kb crkbd/rev4_0/standard -km vial

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: corne_official_vial_firmware
          path: kbd_firmware/src/vial-kb/vial-qmk/*.uf2
